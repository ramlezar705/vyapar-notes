[phases.setup]
nixPkgs = ['python312', 'gcc', 'nodejs_20', 'yarn']

[phases.install]
cmds = [
  'python -m venv /opt/venv',
  '. /opt/venv/bin/activate && pip install -r backend/requirements.txt',
  'cd frontend && yarn install --frozen-lockfile',
]

[phases.build]
cmds = [
  'cd frontend && REACT_APP_BACKEND_URL="" yarn build',
  'rm -rf backend/static && mkdir -p backend/static',
  'cp -r frontend/build/* backend/static/',
]

[start]
cmd = '. /opt/venv/bin/activate && cd backend && uvicorn server:app --host 0.0.0.0 --port ${PORT:-8080}'
